<mizu-directive id="if" directory="if">
  <code #name><span class="hljs-keyword">*if</span><wbr /><span class="muted">="expression"</span></code>
  <p #description>
    Conditionally render an element.
  </p>
  <code #example *skip>
    <div *if="true">
      <!--...-->
    </div>
  </code>
  <mizu-note #note>
    When used on a <a href="https://developer.mozilla.org/docs/Web/HTML/Element/template"><code>&lt;template&gt;</code></a> element, its content is rendered in place of the template which allows to conditionally render several elements at once.
  </mizu-note>
</mizu-directive>
