<load directives="@mizu/mizu/compile,@mizu/test"></load>

<test name="[*mizu.compile] skips the element and its children">
  <render>
    <div *mizu.compile>
      <p ~test.text="'foo'"></p>
    </div>
    <p ~test.text="'bar'"></p>
  </render>
  <expect directives="~test">
    <div>
      <p ~test.text="'foo'"></p>
    </div>
    <p ~test.text="'bar'">bar</p>
  </expect>
</test>
